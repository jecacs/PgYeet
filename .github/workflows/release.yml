name: release

# A release is produced only from a version tag that exactly matches the project version and
# points to a commit already merged into main. Build/test jobs never receive publishing rights.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      sdk_version: ${{ steps.sdk.outputs.version }}
      package_name: ${{ steps.package.outputs.package_name }}
      symbol_name: ${{ steps.package.outputs.symbol_name }}
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
      symbol_sha256: ${{ steps.package.outputs.symbol_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-quality: ga
          global-json-file: global.json

      - name: Verify SDK selection
        id: sdk
        shell: bash
        run: |
          pinned_version="$(jq -r '.sdk.version' global.json)"
          selected_version="$(dotnet --version)"
          if [[ "${selected_version}" != "${pinned_version}" ]]; then
            echo "global.json pins SDK ${pinned_version}, but dotnet selected ${selected_version}."
            dotnet --info
            exit 1
          fi
          echo "version=${pinned_version}" >> "${GITHUB_OUTPUT}"

      - name: Validate tag and release commit
        shell: bash
        run: |
          package_version="$(dotnet msbuild PgYeet/PgYeet.csproj -getProperty:Version -nologo)"
          if [[ -z "${package_version}" || "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match project version ${package_version:-<missing>}."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release commit ${GITHUB_SHA} is not contained in origin/main."
            exit 1
          fi

      - name: Restore and audit dependencies
        run: >-
          dotnet restore PgYeet.sln
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror

      - name: Build
        run: dotnet build PgYeet.sln --no-restore --configuration Release -warnaserror

      - name: Verify formatting
        run: dotnet format whitespace PgYeet.sln --no-restore --verify-no-changes

      - name: Test PostgreSQL and release recovery
        run: >-
          dotnet test PgYeet.Tests/PgYeet.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal

      - name: Pack and record exact artifacts
        id: package
        shell: bash
        run: |
          package_version="$(dotnet msbuild PgYeet/PgYeet.csproj -getProperty:Version -nologo)"
          dotnet pack PgYeet/PgYeet.csproj \
            --no-build \
            --no-restore \
            --configuration Release \
            -p:ContinuousIntegrationBuild=true \
            --output artifacts

          package_name="PgYeet.${package_version}.nupkg"
          symbol_name="PgYeet.${package_version}.snupkg"
          package_path="artifacts/${package_name}"
          symbol_path="artifacts/${symbol_name}"

          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.nupkg' -print)
          mapfile -t symbols < <(find artifacts -maxdepth 1 -type f -name '*.snupkg' -print)
          if (( ${#packages[@]} != 1 || ${#symbols[@]} != 1 )); then
            echo "Expected exactly one nupkg and one snupkg."
            find artifacts -maxdepth 1 -type f -print
            exit 1
          fi
          test -f "${package_path}"
          test -f "${symbol_path}"
          package_entries="$(unzip -Z1 "${package_path}")"
          symbol_entries="$(unzip -Z1 "${symbol_path}")"

          nuspec="$(unzip -p "${package_path}" PgYeet.nuspec)"
          grep -Fq '<id>PgYeet</id>' <<< "${nuspec}"
          grep -Fq "<version>${package_version}</version>" <<< "${nuspec}"
          grep -Fq '<license type="expression">MIT</license>' <<< "${nuspec}"
          grep -Fq "commit=\"${GITHUB_SHA}\"" <<< "${nuspec}"

          readme="$(sed -n 's:.*<readme>\(.*\)</readme>.*:\1:p' <<< "${nuspec}")"
          icon="$(sed -n 's:.*<icon>\(.*\)</icon>.*:\1:p' <<< "${nuspec}")"
          test -n "${readme}"
          test -n "${icon}"
          grep -Fqx "${readme}" <<< "${package_entries}"
          grep -Fqx "${icon}" <<< "${package_entries}"

          for framework in net10.0; do
            grep -Fqx "lib/${framework}/PgYeet.dll" <<< "${package_entries}"
            grep -Fqx "lib/${framework}/PgYeet.xml" <<< "${package_entries}"
            grep -Fqx "lib/${framework}/PgYeet.pdb" <<< "${symbol_entries}"
          done
          if [[ "$(grep -Ec '^lib/[^/]+/PgYeet\.(dll|xml)$' <<< "${package_entries}")" != 2 ]] ||
             [[ "$(grep -Ec '^lib/[^/]+/PgYeet\.pdb$' <<< "${symbol_entries}")" != 1 ]]; then
            echo "Package contains an unexpected PgYeet target-framework asset."
            exit 1
          fi

          package_sha256="$(sha256sum "${package_path}" | cut -d ' ' -f 1)"
          symbol_sha256="$(sha256sum "${symbol_path}" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "${package_sha256}" "${package_name}" > "${package_path}.sha256"
          printf '%s  %s\n' "${symbol_sha256}" "${symbol_name}" > "${symbol_path}.sha256"

          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "symbol_name=${symbol_name}" >> "${GITHUB_OUTPUT}"
          echo "package_sha256=${package_sha256}" >> "${GITHUB_OUTPUT}"
          echo "symbol_sha256=${symbol_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Run the exact packed package on .NET 10
        shell: bash
        run: |
          package_version="$(dotnet msbuild PgYeet/PgYeet.csproj -getProperty:Version -nologo)"
          bash scripts/test-package.sh "artifacts/PgYeet.${package_version}.nupkg"

      - name: Transfer verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-candidate
          path: artifacts/PgYeet.*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: attest-package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-candidate
          path: artifacts

      - name: Verify transferred artifacts
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.validate.outputs.package_sha256 }}
          SYMBOL_NAME: ${{ needs.validate.outputs.symbol_name }}
          SYMBOL_SHA256: ${{ needs.validate.outputs.symbol_sha256 }}
        run: |
          printf '%s  %s\n' "${PACKAGE_SHA256}" "artifacts/${PACKAGE_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "${SYMBOL_SHA256}" "artifacts/${SYMBOL_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "${PACKAGE_SHA256}" "${PACKAGE_NAME}" | \
            cmp --silent - "artifacts/${PACKAGE_NAME}.sha256"
          printf '%s  %s\n' "${SYMBOL_SHA256}" "${SYMBOL_NAME}" | \
            cmp --silent - "artifacts/${SYMBOL_NAME}.sha256"

      - name: Attest package provenance
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/${{ needs.validate.outputs.package_name }}
            artifacts/${{ needs.validate.outputs.symbol_name }}

      - name: Verify and preserve attestation bundle
        shell: bash
        env:
          SYMBOL_NAME: ${{ needs.validate.outputs.symbol_name }}
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
        run: |
          bundle_path="artifacts/${PACKAGE_NAME}.sigstore.json"
          cp -- "${ATTESTATION_BUNDLE}" "${bundle_path}"
          for name in "${PACKAGE_NAME}" "${SYMBOL_NAME}"; do
            gh attestation verify "artifacts/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle "${bundle_path}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done

      - name: Transfer attested release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-release-candidate
          path: artifacts/PgYeet.*
          if-no-files-found: error
          retention-days: 7

  stage-release:
    name: preserve-canonical-release
    needs: [validate, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.stage.outputs.release_id }}
      package_sha256: ${{ steps.stage.outputs.package_sha256 }}
      symbol_sha256: ${{ steps.stage.outputs.symbol_sha256 }}
    steps:
      - name: Download attested candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attested-release-candidate
          path: candidate

      # SDK 10 packs may differ byte-for-byte on a rerun. A complete release is authoritative;
      # never replace its assets with the freshly built candidate, even when still a draft.
      - name: Stage or recover exact release assets
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          SYMBOL_NAME: ${{ needs.validate.outputs.symbol_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          asset_names=("${PACKAGE_NAME}" "${PACKAGE_NAME}.sha256" "${PACKAGE_NAME}.sigstore.json"
                       "${SYMBOL_NAME}" "${SYMBOL_NAME}.sha256")
          verify_assets() {
            local directory="$1"
            for name in "${PACKAGE_NAME}" "${SYMBOL_NAME}"; do
              local digest
              digest="$(sha256sum "${directory}/${name}" | cut -d ' ' -f 1)"
              printf '%s  %s\n' "${digest}" "${name}" | cmp --silent - "${directory}/${name}.sha256"
              gh attestation verify "${directory}/${name}" \
                --repo "${GITHUB_REPOSITORY}" \
                --bundle "${directory}/${PACKAGE_NAME}.sigstore.json" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                --source-ref "${GITHUB_REF}" --source-digest "${GITHUB_SHA}" \
                --deny-self-hosted-runners
            done
          }
          verify_state() {
            jq --exit-status --arg tag "${GITHUB_REF_NAME}" --arg sha "${GITHUB_SHA}" \
              --arg title "PgYeet ${VERSION}" \
              --argjson names "$(printf '%s\n' "${asset_names[@]}" | jq -R . | jq -s .)" '
              .tag_name == $tag and .target_commitish == $sha and .name == $title and
              .author.login == "github-actions[bot]" and
              (.id | type) == "number" and (.draft | type) == "boolean" and
              ([.assets[].name] | sort) == ($names | sort) and
              all(.assets[]; .state == "uploaded")
            ' release.json >/dev/null
          }
          download_assets() {
            mkdir -p canonical
            for name in "${asset_names[@]}"; do
              local asset_id
              asset_id="$(jq --exit-status --raw-output --arg name "${name}" \
                '.assets[] | select(.name == $name) | .id' release.json)"
              gh api -H 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "canonical/${name}"
            done
            verify_assets canonical
          }

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          jq --arg tag "${GITHUB_REF_NAME}" '[.[][] | select(.tag_name == $tag)]' \
            releases.json > matching.json
          count="$(jq length matching.json)"
          if [[ "${count}" == 0 ]]; then
            verify_assets candidate
            # Without a preserved candidate, an existing NuGet version cannot be safely adopted.
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://api.nuget.org/v3-flatcontainer/pgyeet/${VERSION,,}/pgyeet.${VERSION,,}.nupkg")"
            if [[ "${status}" != 404 ]]; then
              echo "Expected unused NuGet version (404), got ${status}; refusing to stage new bytes."
              exit 1
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${GITHUB_REF_NAME}" -f target_commitish="${GITHUB_SHA}" \
              -f name="PgYeet ${VERSION}" -F draft=true -F generate_release_notes=true \
              -F prerelease="$([[ "${VERSION}" == *-* ]] && echo true || echo false)" > release.json
            release_id="$(jq --exit-status --raw-output '.id' release.json)"
            for name in "${asset_names[@]}"; do
              gh api --method POST \
                "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
                -H 'Content-Type: application/octet-stream' --input "candidate/${name}" >/dev/null
            done
          elif [[ "${count}" == 1 ]]; then
            release_id="$(jq --exit-status --raw-output '.[0].id' matching.json)"
          else
            echo "Multiple releases exist for the tag; resolve the ambiguity before retrying."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release.json
          if ! verify_state; then
            echo "Release is incomplete or differs from the expected workflow-owned release."
            echo "No assets were replaced. Inspect the exact release ID before recovery."
            exit 1
          fi
          download_assets
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"
          echo "package_sha256=$(sha256sum "canonical/${PACKAGE_NAME}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"
          echo "symbol_sha256=$(sha256sum "canonical/${SYMBOL_NAME}" | cut -d ' ' -f 1)" >> "${GITHUB_OUTPUT}"

      - name: Transfer canonical artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canonical-release
          path: canonical/PgYeet.*
          if-no-files-found: error
          retention-days: 7

  publish-nuget:
    name: publish-nuget
    needs: [validate, stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      # This privileged job intentionally has no checkout and never executes repository code.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ needs.validate.outputs.sdk_version }}

      - name: Pin publishing SDK
        shell: bash
        env:
          SDK_VERSION: ${{ needs.validate.outputs.sdk_version }}
        run: |
          jq -n --arg version "${SDK_VERSION}" \
            '{sdk: {version: $version, rollForward: "disable", allowPrerelease: false}}' > global.json
          test "$(dotnet --version)" = "${SDK_VERSION}"

      - name: Download attested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release
          path: artifacts

      - name: Verify package, symbols, and provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.stage-release.outputs.package_sha256 }}
          SYMBOL_NAME: ${{ needs.validate.outputs.symbol_name }}
          SYMBOL_SHA256: ${{ needs.stage-release.outputs.symbol_sha256 }}
        run: |
          printf '%s  %s\n' "${PACKAGE_SHA256}" "artifacts/${PACKAGE_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "${SYMBOL_SHA256}" "artifacts/${SYMBOL_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "${PACKAGE_SHA256}" "${PACKAGE_NAME}" | \
            cmp --silent - "artifacts/${PACKAGE_NAME}.sha256"
          printf '%s  %s\n' "${SYMBOL_SHA256}" "${SYMBOL_NAME}" | \
            cmp --silent - "artifacts/${SYMBOL_NAME}.sha256"
          for name in "${PACKAGE_NAME}" "${SYMBOL_NAME}"; do
            gh attestation verify "artifacts/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --bundle "artifacts/${PACKAGE_NAME}.sigstore.json" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners
          done

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jecacs

      - name: Push exact package to NuGet
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/${PACKAGE_NAME}"
          --api-key "${NUGET_API_KEY}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Verify published NuGet package
        shell: bash
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
        run: |
          service_index="${RUNNER_TEMP}/nuget-service-index.json"
          curl --fail --silent --show-error --location \
            https://api.nuget.org/v3/index.json \
            --output "${service_index}"
          package_base_address="$(jq --exit-status --raw-output '
            first(.resources[] | select(."@type" == "PackageBaseAddress/3.0.0") | ."@id")
          ' "${service_index}")"

          package_version="${GITHUB_REF_NAME#v}"
          lower_version="${package_version,,}"
          published_url="${package_base_address}pgyeet/${lower_version}/pgyeet.${lower_version}.nupkg"
          published_package="${RUNNER_TEMP}/published-${PACKAGE_NAME}"
          download_candidate="${published_package}.download"
          for attempt in {1..91}; do
            if curl --fail --silent --location \
              "${published_url}" --output "${download_candidate}"; then
              mv "${download_candidate}" "${published_package}"
              break
            fi
            if (( attempt == 91 )); then
              echo "The published package was not available after 15 minutes of NuGet validation/indexing."
              exit 1
            fi
            if (( attempt % 6 == 0 )); then
              echo "Waiting for NuGet validation/indexing (${attempt}0 seconds elapsed)."
            fi
            sleep 10
          done

          dotnet nuget verify "${published_package}" --all

          signature_file="${RUNNER_TEMP}/nuget-repository-signature.p7s"
          signature_properties="${RUNNER_TEMP}/nuget-repository-signature.properties"
          if ! unzip -p "${published_package}" .signature.p7s > "${signature_file}"; then
            echo "The package downloaded from NuGet has no repository signature."
            exit 1
          fi
          openssl cms -verify -binary -inform DER \
            -in "${signature_file}" -noverify -out "${signature_properties}"

          mapfile -t hash_records < <(tr -d '\r' < "${signature_properties}" | \
            grep --extended-regexp '^[0-9.]+-Hash:[A-Za-z0-9+/]+=*$')
          if (( ${#hash_records[@]} != 1 )); then
            echo "The NuGet repository signature contains an unexpected package-hash record."
            exit 1
          fi

          hash_oid="${hash_records[0]%%-Hash:*}"
          signed_hash="${hash_records[0]#*:}"
          case "${hash_oid}" in
            2.16.840.1.101.3.4.2.1) hash_algorithm=sha256 ;;
            2.16.840.1.101.3.4.2.2) hash_algorithm=sha384 ;;
            2.16.840.1.101.3.4.2.3) hash_algorithm=sha512 ;;
            *)
              echo "The NuGet repository signature uses unsupported hash OID ${hash_oid}."
              exit 1
              ;;
          esac

          local_hash="$(openssl dgst "-${hash_algorithm}" -binary \
            "./artifacts/${PACKAGE_NAME}" | openssl base64 -A)"
          if [[ "${local_hash}" != "${signed_hash}" ]]; then
            echo "NuGet did not publish the exact locally validated package artifact."
            exit 1
          fi

  publish-github-release:
    name: publish-github-release
    needs: [validate, stage-release, publish-nuget]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download attested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: canonical-release
          path: artifacts

      - name: Verify and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.validate.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.stage-release.outputs.package_sha256 }}
          SYMBOL_NAME: ${{ needs.validate.outputs.symbol_name }}
          SYMBOL_SHA256: ${{ needs.stage-release.outputs.symbol_sha256 }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
        run: |
          printf '%s  %s\n' "${PACKAGE_SHA256}" "artifacts/${PACKAGE_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "${SYMBOL_SHA256}" "artifacts/${SYMBOL_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "${PACKAGE_SHA256}" "${PACKAGE_NAME}" | \
            cmp --silent - "artifacts/${PACKAGE_NAME}.sha256"
          printf '%s  %s\n' "${SYMBOL_SHA256}" "${SYMBOL_NAME}" | \
            cmp --silent - "artifacts/${SYMBOL_NAME}.sha256"

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          jq --exit-status --arg tag "${GITHUB_REF_NAME}" --arg sha "${GITHUB_SHA}" \
            --arg title "PgYeet ${VERSION}" '
            .tag_name == $tag and .target_commitish == $sha and .name == $title and
            .author.login == "github-actions[bot]" and (.draft | type) == "boolean"
          ' release.json >/dev/null
          names=("${PACKAGE_NAME}" "${PACKAGE_NAME}.sha256" "${PACKAGE_NAME}.sigstore.json"
                 "${SYMBOL_NAME}" "${SYMBOL_NAME}.sha256")
          jq --exit-status --argjson names "$(printf '%s\n' "${names[@]}" | jq -R . | jq -s .)" '
            ([.assets[].name] | sort) == ($names | sort) and all(.assets[]; .state == "uploaded")
          ' release.json >/dev/null
          for name in "${names[@]}"; do
            asset_id="$(jq --exit-status --raw-output --arg name "${name}" \
              '.assets[] | select(.name == $name) | .id' release.json)"
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "${RUNNER_TEMP}/release-asset"
            cmp "${RUNNER_TEMP}/release-asset" "artifacts/${name}"
          done
          if [[ "$(jq -r '.draft' release.json)" == true ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false >/dev/null
          fi
